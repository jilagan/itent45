    <section class="panel" id="p-break">
      <div class="head">
        <h2 id="bkTitle">Group exercises</h2>
        <p id="bkIntro">Work in groups of three. For this exercise, use no slides or notes and do not ask an AI. Find the answers by looking at what the server sends.</p>
      </div>

      <div class="ctrls">
        <button class="btn" data-bk="1" aria-pressed="true">Exercise 1: inspect an HTTP exchange</button>
        <button class="btn" data-bk="2" aria-pressed="false">Exercise 2: design for a load</button>
      </div>

      <div class="bk-top">
        <div>
          <div class="card">
            <div class="card-t" id="bkTaskT">Your task</div>
            <ol class="task" id="bkTask"></ol>
          </div>
          <div id="bkCards" style="margin-top:18px"></div>
        </div>

        <div>
          <div class="timer" id="timer">
            <div class="clock" id="clock">20:00</div>
            <div class="presets">
              <button data-m="5">5m</button><button data-m="10">10m</button>
              <button data-m="15">15m</button><button data-m="20">20m</button>
              <button data-m="30">30m</button>
            </div>
            <div class="ctrls" style="justify-content:center;margin:0">
              <button class="btn primary" id="tRun">▶ Start</button>
              <button class="btn" id="tRst">Reset</button>
            </div>
          </div>
          <div class="card" style="margin-top:16px">
            <div class="card-t">Roles (rotate for exercise 2)</div>
            <div class="roles" style="grid-template-columns:1fr;margin:0" id="bkRoles"></div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:18px">
        <div class="card-t">Report back</div>
        <p style="margin:0;font-size:.85em;color:var(--dim);line-height:1.6" id="bkReport"></p>
      </div>

      <div class="listen instructor">
        <div class="card-t">What to listen for (instructor only)</div>
        <ul style="margin:0;padding-left:18px" id="bkListen"></ul>
      </div>
    </section>
